<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraWallet - บันทึกรายรับรายจ่าย</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AuraWallet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-24">
    <!-- Header -->
    <header class="pt-8 pb-6 px-6 max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-slate-400 text-sm font-light">ยินดีต้อนรับกลับ,</p>
                <h1 class="text-2xl font-bold tracking-tight text-white">AuraWallet ✨</h1>
            </div>
            <button onclick="resetData()" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 px-3 py-1.5 rounded-full border border-rose-500/20 transition">ล้างข้อมูล</button>
        </div>

        <!-- Balance Card -->
        <div class="glass-card rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <p class="text-slate-400 text-sm font-medium mb-1">ยอดเงินคงเหลือทั้งหมด</p>
            <h2 id="totalBalance" class="text-3xl font-extrabold text-white tracking-tight mb-6">฿0.00</h2>
            
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700/50">
                <div>
                    <div class="flex items-center space-x-1.5 text-emerald-400 text-xs font-medium mb-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                        <span>รายรับรวม</span>
                    </div>
                    <p id="totalIncome" class="text-lg font-bold text-emerald-400">฿0.00</p>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5 text-rose-400 text-xs font-medium mb-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15"></path></svg>
                        <span>รายจ่ายรวม</span>
                    </div>
                    <p id="totalExpense" class="text-lg font-bold text-rose-400">฿0.00</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-6 space-y-6">
        <!-- Add Transaction Form -->
        <section class="glass-card rounded-3xl p-6 shadow-xl">
            <h3 class="text-base font-semibold text-white mb-4">➕ บันทึกรายการใหม่</h3>
            <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                <!-- Type Selector -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/60 rounded-2xl border border-slate-800">
                    <button type="button" id="typeExpenseBtn" onclick="setType('expense')" class="py-2.5 text-sm font-medium rounded-xl transition bg-rose-500 text-white shadow-md">รายจ่าย</button>
                    <button type="button" id="typeIncomeBtn" onclick="setType('income')" class="py-2.5 text-sm font-medium rounded-xl transition text-slate-400 hover:text-white">รายรับ</button>
                </div>

                <!-- Amount -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-semibold text-lg">
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">หมวดหมู่</label>
                    <select id="category" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <!-- Options will update dynamically -->
                    </select>
                </div>

                <!-- Note -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">บันทึกช่วยจำ (โน้ต)</label>
                    <input type="text" id="note" placeholder="เช่น ค่ากาแฟ, เงินเดือนออก" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl px-4 py-3
